<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the iPhone notch/home bar; safe-area padding keeps controls clear. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#69C7B9" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=873e94e52c" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=873e94e52c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=873e94e52c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Slack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MindfulTech Slack</title>
    <script>
      // Start fetching the runtime config while the app bundle is still downloading
      // (main.tsx awaits this promise instead of starting its own request).
      window.__configRequest = fetch("/config.json", { cache: "no-store" });
      // Apply the saved theme before first paint (no light flash in dark mode). Default: light.
      try {
        var pref = localStorage.getItem("slack.theme") || "light";
        var dark =
          pref === "dark" ||
          (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {
        // Storage blocked (e.g. privacy mode): keep the light default; main.tsx re-applies the theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
