<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the iPhone notch/home bar; safe-area padding keeps controls clear. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1A1D21" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=b0ae91fbc6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=b0ae91fbc6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=b0ae91fbc6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Slack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>MindfulTech Slack</title>
    <script>
      // Start fetching the runtime config while the app bundle is still downloading
      // (main.tsx awaits this promise instead of starting its own request).
      window.__configRequest = fetch("/config.json", { cache: "no-store" });
      // One dark look everywhere (Phase 37b): `dark` is on <html> above. The
      // desktop app may report real OS glass before this runs (lib/theme.ts).
      if (window.__MINDFULTECH_GLASS__ === "vibrancy" || window.__MINDFULTECH_GLASS__ === "mica") {
        document.documentElement.classList.add("native-glass");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
