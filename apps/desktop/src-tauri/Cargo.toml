[package]
name = "mindfultech-slack"
version = "0.3.0"
description = "MindfulTech Slack desktop app"
authors = ["MindfulTech"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mindfultech_slack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS (fine outside the Mac App Store).
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
# AI Skills (Phase 44): the files `install_skill` receives.
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# Which Windows: Mica (native glass) only from Windows 11 (build 22000).
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
