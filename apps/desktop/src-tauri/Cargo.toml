[package]
name = "mindfultech-slack"
version = "0.1.0"
description = "MindfulTech Slack desktop app"
authors = ["MindfulTech"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mindfultech_slack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
