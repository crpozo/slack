name: Desktop

# Builds the Tauri desktop app (apps/desktop) for Windows and macOS on GitHub's
# runners, so nobody needs Rust or C++ build tools locally, and attaches the
# installers to a GitHub Release:
#   Windows  MindfulTech.Slack_<version>_x64_en-US.msi and …_x64-setup.exe
#   macOS    MindfulTech.Slack_<version>_universal.dmg (Apple Silicon + Intel)
#            and MindfulTech.Slack_universal.app.tar.gz
#
# Run it from Actions → Desktop → Run workflow (release `desktop-v<version>`,
# the version in apps/desktop/package.json), or push a `v*` tag (release on
# that tag). Builds are not code-signed yet: see "Desktop app" in the README.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload its assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: macos-latest queues for a long time on public runners. macos-14
          # is Apple Silicon and builds the universal (Apple Silicon + Intel) .dmg.
          - platform: macos-14
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Linux is one line away: { platform: ubuntu-22.04, args: "", rust-targets: "" }
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Only the Tauri CLI is needed: the window loads https://slack.mindfultech.ec.
      - run: pnpm install --frozen-lockfile --filter desktop

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: MindfulTech Slack Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Desktop installers for MindfulTech Slack.

            - **Windows:** the `.msi` (or `-setup.exe`). SmartScreen may warn because the build isn't signed: _More info → Run anyway_.
            - **macOS:** the `.dmg` (Apple Silicon and Intel). The build isn't notarized: after dragging the app to Applications run `xattr -cr "/Applications/MindfulTech Slack.app"` once, then open it.
          releaseDraft: false
          prerelease: false
          # Also keep the installers on the run itself (Actions → run → Artifacts).
          uploadWorkflowArtifacts: true
