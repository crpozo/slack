packages:
  - apps/web
  - apps/desktop
  - packages/*
  - backend
  - infra

# Supply-chain guard: never resolve a version published less than a day ago
# (pnpm 11's default; pinned here so pnpm 10 resolves the same way and the
# lockfile always passes pnpm 11's check).
minimumReleaseAge: 1440

# Packages allowed to run install scripts: `onlyBuiltDependencies` for pnpm 10,
# `allowBuilds` for pnpm 11 (which ignores the former and fails the install).
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true

# aws-sdk-client-mock imports @smithy/types without declaring it, so it would pick
# up whatever version gets hoisted (Amplify brings old ones). Pin it to the
# backend's AWS SDK version via a peer dependency.
packageExtensions:
  aws-sdk-client-mock:
    peerDependencies:
      "@smithy/types": "*"
